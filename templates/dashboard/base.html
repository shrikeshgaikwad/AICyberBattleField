<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cyber Battlefield{% endblock %}</title>
    <meta name="description" content="Dual Autonomous AI - Attack & Defense Simulation Dashboard">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a1f36;
            --bg-card-hover: #1f2544;
            --border: #2a3154;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --red-primary: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.3);
            --red-bg: rgba(239, 68, 68, 0.1);
            --blue-primary: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.3);
            --blue-bg: rgba(59, 130, 246, 0.1);
            --green: #22c55e;
            --yellow: #eab308;
            --orange: #f97316;
            --purple: #a855f7;
            --cyan: #06b6d4;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ─── Navbar ─── */
        .navbar {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--red-primary), var(--purple), var(--blue-primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .navbar-brand .badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: var(--purple);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 4px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .nav-links a.active {
            background: rgba(168, 85, 247, 0.15);
            color: var(--purple);
        }

        /* ─── Layout ─── */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 1.875rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.925rem;
        }

        /* ─── Cards ─── */
        .grid {
            display: grid;
            gap: 1.25rem;
        }

        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        @media (max-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: all 0.25s ease;
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(168, 85, 247, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .stat-card {
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .stat-card.red::before { background: linear-gradient(90deg, var(--red-primary), var(--orange)); }
        .stat-card.blue::before { background: linear-gradient(90deg, var(--blue-primary), var(--cyan)); }
        .stat-card.green::before { background: linear-gradient(90deg, var(--green), var(--cyan)); }
        .stat-card.purple::before { background: linear-gradient(90deg, var(--purple), var(--blue-primary)); }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -1px;
        }

        .stat-card.red .stat-value { color: var(--red-primary); }
        .stat-card.blue .stat-value { color: var(--blue-primary); }
        .stat-card.green .stat-value { color: var(--green); }
        .stat-card.purple .stat-value { color: var(--purple); }

        .stat-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* ─── Sections ─── */
        .section {
            margin-top: 2rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.red { background: var(--red-primary); box-shadow: 0 0 8px var(--red-glow); }
        .dot.blue { background: var(--blue-primary); box-shadow: 0 0 8px var(--blue-glow); }
        .dot.green { background: var(--green); }
        .dot.purple { background: var(--purple); }

        /* ─── Tables ─── */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(42, 49, 84, 0.5);
            color: var(--text-secondary);
        }

        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        /* ─── Badges ─── */
        .badge-severity {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-critical { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-high { background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
        .badge-medium { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-low { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-info { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }

        .badge-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .badge-failed { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .badge-running { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-pending { background: rgba(234, 179, 8, 0.15); color: #facc15; }

        /* ─── Versus Banner ─── */
        .versus-banner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05), rgba(30, 30, 50, 0.5), rgba(59, 130, 246, 0.05));
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .team-banner {
            text-align: center;
        }

        .team-banner.red h2 { color: var(--red-primary); }
        .team-banner.blue h2 { color: var(--blue-primary); }

        .team-banner h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
        }

        .team-banner .score {
            font-size: 3rem;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
        }

        .versus-divider {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-muted);
            text-align: center;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* ─── Animations ─── */
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 var(--red-glow); }
            50% { box-shadow: 0 0 20px 5px var(--red-glow); }
        }

        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0 0 var(--blue-glow); }
            50% { box-shadow: 0 0 20px 5px var(--blue-glow); }
        }

        .pulse-red { animation: pulse-red 2s infinite; }
        .pulse-blue { animation: pulse-blue 2s infinite; }

        /* ─── Buttons ─── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-red {
            background: linear-gradient(135deg, var(--red-primary), #dc2626);
            color: white;
        }
        .btn-red:hover { transform: translateY(-1px); box-shadow: 0 4px 15px var(--red-glow); }

        .btn-blue {
            background: linear-gradient(135deg, var(--blue-primary), #2563eb);
            color: white;
        }
        .btn-blue:hover { transform: translateY(-1px); box-shadow: 0 4px 15px var(--blue-glow); }

        .btn-purple {
            background: linear-gradient(135deg, var(--purple), #7c3aed);
            color: white;
        }
        .btn-purple:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }

        /* ─── Footer ─── */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'dashboard:index' %}" class="navbar-brand">
            <span class="logo">⚔️ CyberBattlefield</span>
            <span class="badge">AI</span>
        </a>
        <ul class="nav-links">
            <li><a href="{% url 'dashboard:index' %}" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a></li>
            <li><a href="{% url 'dashboard:red_team' %}" class="{% if 'red-team' in request.path %}active{% endif %}">🔴 Red Team</a></li>
            <li><a href="{% url 'dashboard:blue_team' %}" class="{% if 'blue-team' in request.path %}active{% endif %}">🔵 Blue Team</a></li>
            <li><a href="{% url 'dashboard:simulations' %}" class="{% if 'simulations' in request.path %}active{% endif %}">⚔️ Simulations</a></li>
            <li><a href="/admin/" target="_blank">⚙️ Admin</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        Dual Autonomous AI for Software Vulnerability Exploitation & Defense
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
